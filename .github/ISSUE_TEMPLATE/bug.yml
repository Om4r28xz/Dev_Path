name: Defecto
description: Reportar un comportamiento reproducible en una versión concreta.
title: "[BUG] "
labels:
  - bug
body:
  - type: textarea
    id: observed
    attributes:
      label: Comportamiento observado
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Pasos mínimos para reproducir
      description: Usa datos sintéticos y elimina secretos o información personal.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit o versión afectada
      placeholder: abc1234 o v0.1.0
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia segura
      description: Incluye logs o capturas redactados y el entorno utilizado.
    validations:
      required: true
