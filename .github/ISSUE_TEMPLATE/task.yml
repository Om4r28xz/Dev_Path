name: Tarea del backlog
description: Preparar una tarea identificada del plan de DevPath.
title: "[ID] "
labels:
  - task
body:
  - type: input
    id: task-id
    attributes:
      label: ID de la tarea
      description: Usa el identificador exacto del backlog, por ejemplo FND-01.
      placeholder: FND-01
    validations:
      required: true
  - type: dropdown
    id: owner-role
    attributes:
      label: Rol responsable
      options:
        - P1 — backend y datos
        - P2 — frontend e integración técnica
        - P3 — catálogo y contenido
        - P4 — contratos y documentación
        - P5 — aceptación y evidencias
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Alcance y archivos
      description: Describe el resultado verificable y los archivos permitidos.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencias integradas
      description: Incluye commits o PR ya fusionados; una rama sin merge no satisface una dependencia.
      placeholder: "CTR-01 integrado en <commit>"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación
      description: Lista criterios observables y casos de error relevantes.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validación prevista
      description: Indica comandos, revisión manual y responsable de cada comprobación.
    validations:
      required: true
