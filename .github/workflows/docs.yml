# Docs Workflow — DevPath Monorepo
#
# Runs documentation checks when Markdown or docs files change.
# The main CI workflow runs on every pull request.
#
# This workflow is informational and does not replace CI.
# Branch protection must require "CI gate (required)".

name: Docs

on:
  push:
    branches: [develop, main]
    paths:
      - 'docs/**'
      - '*.md'
      - 'README.md'
  pull_request:
    branches: [develop, main]
    paths:
      - 'docs/**'
      - '*.md'
      - 'README.md'

permissions:
  contents: read

jobs:
  docs-lint:
    name: Docs check
    runs-on: ubuntu-latest
    steps:
      - name: Documentation change detected
        run: echo "Documentation workflow completed. Main CI is required separately."
