openapi: 3.1.0
info:
  title: DevPath M4 — PROPOSED learning paths
  version: 0.1.0
  description: PROPOSED until LRN-01 confirms curated content/templates.
    Rule-based, no generative AI. Create from own saved analysis snapshot and
    own current project snapshot/revision; persist generator/content/catalog
    versions and activity text. Never recalculate historical match percentage or
    update personal skills on completion. See EXTENDED-CONTRACTS.md for
    idempotency, progress and deletion semantics.
x-contract-status: proposed
servers:
  - url: /api/v1
security:
  - bearerAuth: []
