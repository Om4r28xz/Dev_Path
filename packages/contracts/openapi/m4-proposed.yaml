components:
  securitySchemes:
    bearerAuth:
      $ref: ./public.yaml#/components/securitySchemes/bearerAuth
  schemas:
    CreateLearningPathRequest:
      type: object
      additionalProperties: false
      required:
        - analysisId
      properties:
        analysisId: *a3
    UpdateLearningStepRequest:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status: &a4
          type: string
          enum:
            - pending
            - in_progress
            - completed
    LearningStep:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - activity
        - reason
        - skillIds
        - projectId
        - resourceUrl
        - status
        - completedAt
      properties:
        id: *a3
        title:
          type: string
          minLength: 1
          maxLength: 120
        activity:
          type: string
          minLength: 1
          maxLength: 5000
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        skillIds:
          $ref: ./public.yaml#/components/schemas/UniqueSkillIds
        projectId:
          type:
            - string
            - 'null'
          format: uuid
        resourceUrl:
          type:
            - string
            - 'null'
          format: uri
          pattern: ^https?://
          maxLength: 2048
        status: *a4
        completedAt:
          type:
            - string
            - 'null'
          format: date-time
      allOf:
        - if:
            properties:
              status:
                const: completed
            required:
              - status
          then:
            properties:
              completedAt: &a5
                type: string
                format: date-time
          else:
            properties:
              completedAt:
                type: 'null'
    LearningProgress:
      type: object
      additionalProperties: false
      required:
        - completed
        - total
        - percentage
      properties:
        completed:
          type: integer
          minimum: 0
          maximum: 200
        total:
          type: integer
          minimum: 0
          maximum: 200
        percentage:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 100
      allOf:
        - if:
            properties:
              total:
                const: 0
            required:
              - total
          then:
            properties:
              completed:
                const: 0
              percentage:
                type: 'null'
          else:
            properties:
              percentage:
                type: integer
    LearningPath:
      type: object
      additionalProperties: false
      required:
        - id
        - analysisId
        - projectsRevision
        - versions
        - steps
        - progress
        - message
        - createdAt
        - updatedAt
      properties:
        id: *a3
        analysisId: *a3
        projectsRevision:
          type: integer
          minimum: 0
        versions:
          type: object
          additionalProperties: false
          required:
            - catalog
            - content
            - generator
          properties:
            catalog:
              type: string
              minLength: 1
              maxLength: 40
            content:
              type: string
              minLength: 1
              maxLength: 40
            generator:
              type: string
              minLength: 1
              maxLength: 40
        steps:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/LearningStep'
        progress:
          $ref: '#/components/schemas/LearningProgress'
        message:
          type:
            - string
            - 'null'
          maxLength: 500
        createdAt: *a5
        updatedAt: *a5
    LearningPathList:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/LearningPath'
        nextCursor:
          type:
            - string
            - 'null'
          minLength: 16
          maxLength: 512
    SharedError:
      $ref: ./public.yaml#/components/schemas/ErrorResponse
  responses:
    Unauthenticated:
      description: Missing, expired or invalid bearer token; same envelope as M1.
      content:
        application/json:
          schema:
            $ref: ./public.yaml#/components/schemas/ErrorResponse
          example:
            error:
              code: UNAUTHENTICATED
              message: Se requiere autenticación.
              requestId: 5e9220ea-e5b7-42bb-8a88-adf08763837f
