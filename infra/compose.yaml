name: devpath-local
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run setup-local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup-local}
      POSTGRES_DB: ${POSTGRES_DB:?Run setup-local}
    volumes:
      - database:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: ..
      dockerfile: infra/docker/runtime.Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: [pnpm, --filter, '@devpath/db', migrate]
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]
    profiles: [tools]
  seed:
    extends: migrate
    command: [pnpm, --filter, '@devpath/db', seed]
    profiles: [tools]
  engine:
    build:
      context: ..
      dockerfile: infra/docker/runtime.Dockerfile
    command: [pnpm, --filter, '@devpath/skill-engine', start]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      ENGINE_SERVICE_SECRET: ${ENGINE_SERVICE_SECRET:?Run setup-local}
    networks: [internal]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      retries: 10
  api:
    build:
      context: ..
      dockerfile: infra/docker/runtime.Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      AUTH_LOCAL_HTTP: 'true'
      AUTH_PRIVATE_KEY_FILE: /run/keys/access-private.pem
      ENGINE_URL: http://engine:3001
      ENGINE_SERVICE_SECRET: ${ENGINE_SERVICE_SECRET}
    volumes:
      - ../.local-data/keys:/run/keys:ro
    networks: [internal]
    depends_on:
      db: { condition: service_healthy }
      engine: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      retries: 10
  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    ports: ['127.0.0.1:8080:8080']
    networks: [internal, edge]
    depends_on:
      api: { condition: service_healthy }
networks:
  internal: { internal: true }
  edge: {}
volumes:
  database: {}
